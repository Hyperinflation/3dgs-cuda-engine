<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Postshot 3DGS Web Viewer - 60 FPS Ultra Akıcı Mimari Model</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(18, 24, 38, 0.88);
            --panel-border: rgba(255, 255, 255, 0.14);
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .header {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse-dot {
            width: 9px;
            height: 9px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--success);
        }

        .title-group h1 {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
        }

        .title-group p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .stats-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
        }

        .preset-bar {
            position: absolute;
            bottom: 86px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 6px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            padding: 6px 10px;
            border-radius: 30px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .preset-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .preset-btn.active, .preset-btn:hover {
            background: var(--accent-gradient);
            color: #fff;
        }

        .controls-card {
            position: absolute;
            bottom: 14px;
            left: 14px;
            right: 14px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .slider-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text);
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action.active {
            background: rgba(56, 189, 248, 0.25);
            border-color: var(--accent);
            color: var(--accent);
        }

        .hud-top-left {
            position: absolute;
            top: 72px;
            left: 14px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .hud-pill {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .hud-pill span {
            color: #34d399;
            font-weight: 800;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.3s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="font-weight:700; font-size:14px;">3DGS Model Yükleniyor...</div>
        <div id="loading-detail" style="font-size:11px; color:#94a3b8;">GPU VRAM Hazırlanıyor (1.25M Splats)...</div>
    </div>

    <header class="header">
        <div class="brand">
            <div class="pulse-dot"></div>
            <div class="title-group">
                <h1>3DGS Mimari Drone Rekonstrüksiyonu</h1>
                <p>NVIDIA RTX 3090 • 60 FPS Hacimsel Splat Motoru</p>
            </div>
        </div>
        <div class="stats-badge" id="splat-count-badge">
            ⚡ <span>1.25M Splats</span>
        </div>
    </header>

    <div class="hud-top-left">
        <div class="hud-pill">FPS: <span id="fps-counter">60</span></div>
        <div class="hud-pill">GPU Motoru: <span>WebGL2 Hardware Accelerated</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="splat-canvas"></canvas>
    </div>

    <div class="preset-bar">
        <button class="preset-btn active" onclick="setPreset('orbit')">🛸 360° Vitrin</button>
        <button class="preset-btn" onclick="setPreset('facade')">🏢 Ön Cephe</button>
        <button class="preset-btn" onclick="setPreset('top')">📐 Kuşbakışı</button>
        <button class="preset-btn" onclick="setPreset('close')">🔍 Yakın Detay</button>
    </div>

    <div class="controls-card">
        <div class="slider-group">
            <span class="slider-label">Splat Doluluğu:</span>
            <input type="range" id="size-slider" min="0.5" max="3.0" step="0.1" value="1.4" oninput="updateSplatScale(this.value)">
            <span class="slider-label" id="size-val" style="color:var(--accent); font-weight:700; min-width:30px;">1.4x</span>
        </div>
        <button class="btn-action active" id="btn-spin" onclick="toggleAutoSpin()">🔄 360° Döndür</button>
        <button class="btn-action" onclick="resetCamera()">🎯 Yeniden Merkezle</button>
    </div>

    <script>
        const canvas = document.getElementById('splat-canvas');
        const gl = canvas.getContext('webgl2', { antialias: false, powerPreference: "high-performance", alpha: false });

        // Accurate COLMAP Drone Orbit Centroid
        const sceneCenter = [0.35, -0.15, 0.0];
        let targetLookAt = [...sceneCenter];

        let autoSpin = true;
        let spinSpeed = 0.0035;
        let spinAngle = 0.6;
        let pitchAngle = -0.25;
        let cameraRadius = 5.2;
        let pointSizeMultiplier = 1.4;

        let isDragging = false;
        let lastX = 0, lastY = 0;
        let initialPinchDist = 0;
        let numActiveSplats = 0;

        let frameCount = 0;
        let lastTime = performance.now();
        const fpsElem = document.getElementById('fps-counter');

        function resize() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        canvas.addEventListener('pointerdown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            if (autoSpin) setAutoSpin(false);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            spinAngle -= dx * 0.005;
            pitchAngle += dy * 0.005;
            pitchAngle = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitchAngle));
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('pointerup', () => { isDragging = false; });
        window.addEventListener('pointercancel', () => { isDragging = false; });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                initialPinchDist = Math.hypot(dx, dy);
                if (autoSpin) setAutoSpin(false);
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDist > 0) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                const delta = initialPinchDist - dist;
                cameraRadius += delta * 0.012;
                cameraRadius = Math.max(1.0, Math.min(cameraRadius, 20.0));
                initialPinchDist = dist;
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            cameraRadius += e.deltaY * 0.004;
            cameraRadius = Math.max(1.0, Math.min(cameraRadius, 20.0));
        }, { passive: false });

        // High-Performance 60 FPS Shader
        const vsSource = `
            attribute vec3 aPosition;
            attribute vec4 aColor;
            attribute float aScale;

            uniform mat4 uMVP;
            uniform float uSizeScale;
            uniform float uViewportHeight;

            varying vec4 vColor;

            void main() {
                vColor = aColor;
                vec4 pos = uMVP * vec4(aPosition.x, -aPosition.y, aPosition.z, 1.0);
                gl_Position = pos;

                float dist = max(pos.w, 0.2);
                float projectedSize = (aScale * uSizeScale * uViewportHeight * 1.5) / dist;
                gl_PointSize = clamp(projectedSize, 2.0, 32.0);
            }
        `;

        const fsSource = `
            precision mediump float;
            varying vec4 vColor;

            void main() {
                vec2 coord = gl_PointCoord - vec2(0.5);
                float distSq = dot(coord, coord);
                if (distSq > 0.25) discard;
                
                // Soft Gaussian radial blend with vibrant exposure
                float alpha = (1.0 - distSq * 3.6) * vColor.a * 1.25;
                vec3 rgb = vColor.rgb * 1.15;
                gl_FragColor = vec4(rgb, alpha);
            }
        `;

        function compileShader(gl, type, src) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, src);
            gl.compileShader(shader);
            return shader;
        }

        const vs = compileShader(gl, gl.VERTEX_SHADER, vsSource);
        const fs = compileShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);

        const aPosition = gl.getAttribLocation(program, "aPosition");
        const aColor = gl.getAttribLocation(program, "aColor");
        const aScale = gl.getAttribLocation(program, "aScale");

        const uMVP = gl.getUniformLocation(program, "uMVP");
        const uSizeScale = gl.getUniformLocation(program, "uSizeScale");
        const uViewportHeight = gl.getUniformLocation(program, "uViewportHeight");

        const posBuffer = gl.createBuffer();
        const colBuffer = gl.createBuffer();
        const scaleBuffer = gl.createBuffer();

        function mat4Perspective(out, fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov / 2);
            out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
            out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
            out[8] = 0; out[9] = 0; out[10] = (far + near) / (near - far); out[11] = -1;
            out[12] = 0; out[13] = 0; out[14] = (2 * far * near) / (near - far); out[15] = 0;
        }

        function mat4LookAt(out, eye, center, up) {
            let z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
            let len = Math.hypot(z0, z1, z2) || 1;
            z0 /= len; z1 /= len; z2 /= len;

            let x0 = up[1] * z2 - up[2] * z1, x1 = up[2] * z0 - up[0] * z2, x2 = up[0] * z1 - up[1] * z0;
            len = Math.hypot(x0, x1, x2) || 1;
            x0 /= len; x1 /= len; x2 /= len;

            let y0 = z1 * x2 - z2 * x1, y1 = z2 * x0 - z0 * x2, y2 = z0 * x1 - z1 * x0;
            out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
            out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
            out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
            out[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
            out[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
            out[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
            out[15] = 1;
        }

        function mat4Multiply(out, a, b) {
            for (let i = 0; i < 4; i++) {
                const ai0 = a[i], ai1 = a[i+4], ai2 = a[i+8], ai3 = a[i+12];
                out[i]    = ai0 * b[0] + ai1 * b[1] + ai2 * b[2] + ai3 * b[3];
                out[i+4]  = ai0 * b[4] + ai1 * b[5] + ai2 * b[6] + ai3 * b[7];
                out[i+8]  = ai0 * b[8] + ai1 * b[9] + ai2 * b[10] + ai3 * b[11];
                out[i+12] = ai0 * b[12] + ai1 * b[13] + ai2 * b[14] + ai3 * b[15];
            }
        }

        async function loadSplatModel() {
            const overlay = document.getElementById('loading-overlay');
            const detailText = document.getElementById('loading-detail');
            const badge = document.getElementById('splat-count-badge');

            try {
                detailText.innerText = "1.25M Gaussian Splat GPU'ya yükleniyor...";
                const response = await fetch('model.splat?v=' + Date.now());
                if (!response.ok) throw new Error("Splat dosyası bulunamadı");

                const buffer = await response.arrayBuffer();
                const totalSplats = Math.floor(buffer.byteLength / 32);
                const dataView = new DataView(buffer);

                const positions = new Float32Array(totalSplats * 3);
                const colors = new Float32Array(totalSplats * 4);
                const scales = new Float32Array(totalSplats);
                let validCount = 0;

                for (let i = 0; i < totalSplats; i++) {
                    const offset = i * 32;
                    const px = dataView.getFloat32(offset + 0, true);
                    const py = dataView.getFloat32(offset + 4, true);
                    const pz = dataView.getFloat32(offset + 8, true);

                    // Skip far floaters
                    const distSq = (px - sceneCenter[0])**2 + (py - sceneCenter[1])**2 + (pz - sceneCenter[2])**2;
                    if (distSq > 160.0) continue;

                    positions[validCount * 3 + 0] = px;
                    positions[validCount * 3 + 1] = py;
                    positions[validCount * 3 + 2] = pz;

                    const sx = Math.abs(dataView.getFloat32(offset + 12, true));
                    const sy = Math.abs(dataView.getFloat32(offset + 16, true));
                    const sz = Math.abs(dataView.getFloat32(offset + 20, true));
                    scales[validCount] = Math.max(0.015, Math.min((sx + sy + sz) / 3.0, 0.09));

                    colors[validCount * 4 + 0] = dataView.getUint8(offset + 24) / 255.0;
                    colors[validCount * 4 + 1] = dataView.getUint8(offset + 25) / 255.0;
                    colors[validCount * 4 + 2] = dataView.getUint8(offset + 26) / 255.0;
                    colors[validCount * 4 + 3] = (dataView.getUint8(offset + 27) / 255.0) || 0.85;

                    validCount++;
                }

                numActiveSplats = validCount;

                gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, positions.subarray(0, validCount * 3), gl.STATIC_DRAW);

                gl.bindBuffer(gl.ARRAY_BUFFER, colBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, colors.subarray(0, validCount * 4), gl.STATIC_DRAW);

                gl.bindBuffer(gl.ARRAY_BUFFER, scaleBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, scales.subarray(0, validCount), gl.STATIC_DRAW);

                badge.innerHTML = `⚡ <span>${(validCount / 1000).toFixed(0)}K Splats</span>`;

                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);

            } catch (err) {
                console.warn("Fast Splat Loader error:", err);
                detailText.innerText = "Yükleme hatası: " + err.message;
            }
        }

        const pMatrix = new Float32Array(16);
        const vMatrix = new Float32Array(16);
        const mvpMatrix = new Float32Array(16);

        function render(now) {
            requestAnimationFrame(render);

            frameCount++;
            if (now - lastTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastTime));
                fpsElem.innerText = fps;
                fpsElem.style.color = fps >= 50 ? '#34d399' : (fps >= 30 ? '#facc15' : '#f87171');
                frameCount = 0;
                lastTime = now;
            }

            if (autoSpin) {
                spinAngle += spinSpeed;
            }

            const eyeX = targetLookAt[0] + cameraRadius * Math.sin(spinAngle) * Math.cos(pitchAngle);
            const eyeY = -targetLookAt[1] + cameraRadius * Math.sin(pitchAngle);
            const eyeZ = targetLookAt[2] + cameraRadius * Math.cos(spinAngle) * Math.cos(pitchAngle);

            const aspect = canvas.width / canvas.height;
            mat4Perspective(pMatrix, 48 * Math.PI / 180, aspect, 0.1, 100.0);
            mat4LookAt(vMatrix, [eyeX, eyeY, eyeZ], [targetLookAt[0], -targetLookAt[1], targetLookAt[2]], [0, 1, 0]);
            mat4Multiply(mvpMatrix, pMatrix, vMatrix);

            gl.clearColor(0.05, 0.07, 0.10, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            if (numActiveSplats > 0) {
                gl.useProgram(program);

                gl.uniformMatrix4fv(uMVP, false, mvpMatrix);
                gl.uniform1f(uSizeScale, pointSizeMultiplier);
                gl.uniform1f(uViewportHeight, canvas.height);

                gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
                gl.enableVertexAttribArray(aPosition);
                gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);

                gl.bindBuffer(gl.ARRAY_BUFFER, colBuffer);
                gl.enableVertexAttribArray(aColor);
                gl.vertexAttribPointer(aColor, 4, gl.FLOAT, false, 0, 0);

                gl.bindBuffer(gl.ARRAY_BUFFER, scaleBuffer);
                gl.enableVertexAttribArray(aScale);
                gl.vertexAttribPointer(aScale, 1, gl.FLOAT, false, 0, 0);

                gl.drawArrays(gl.POINTS, 0, numActiveSplats);
            }
        }

        function setAutoSpin(enabled) {
            autoSpin = enabled;
            const btn = document.getElementById('btn-spin');
            if (autoSpin) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        window.toggleAutoSpin = function() {
            setAutoSpin(!autoSpin);
        };

        window.resetCamera = function() {
            targetLookAt = [...sceneCenter];
            spinAngle = 0.6;
            pitchAngle = -0.25;
            cameraRadius = 5.2;
            pointSizeMultiplier = 1.4;
            document.getElementById('size-slider').value = 1.4;
            document.getElementById('size-val').innerText = '1.4x';
            setAutoSpin(true);
        };

        window.updateSplatScale = function(val) {
            pointSizeMultiplier = parseFloat(val);
            document.getElementById('size-val').innerText = parseFloat(val).toFixed(1) + 'x';
        };

        window.setPreset = function(type) {
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');

            if (type === 'orbit') {
                targetLookAt = [...sceneCenter];
                pitchAngle = -0.25;
                cameraRadius = 5.2;
                setAutoSpin(true);
            } else if (type === 'facade') {
                targetLookAt = [...sceneCenter];
                spinAngle = 0.0;
                pitchAngle = -0.05;
                cameraRadius = 4.2;
                setAutoSpin(false);
            } else if (type === 'top') {
                targetLookAt = [...sceneCenter];
                pitchAngle = -1.25;
                cameraRadius = 6.2;
                setAutoSpin(false);
            } else if (type === 'close') {
                targetLookAt = [...sceneCenter];
                pitchAngle = -0.15;
                cameraRadius = 2.4;
                setAutoSpin(false);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadSplatModel();
            requestAnimationFrame(render);
        });
    </script>
</body>
</html>
